<svg width="100%" viewBox="0 0 1280 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Export PNG sequence feature banner</title>
<desc>A dark node-editor scene: an Output node set to PNG sequence produces a filmstrip of numbered PNG frames on a transparency checkerboard.</desc>
<defs>
<pattern id="pdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" fill="#26262c"/></pattern>
<pattern id="ck" width="20" height="20" patternUnits="userSpaceOnUse"><rect width="20" height="20" fill="#34343c"/><rect width="10" height="10" fill="#2a2a31"/><rect x="10" y="10" width="10" height="10" fill="#2a2a31"/></pattern>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}</style>
<marker id="parr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<clipPath id="pB"><rect x="688" y="142" width="170" height="118" rx="10"/></clipPath>
<clipPath id="pF"><rect x="968" y="160" width="126" height="90" rx="6"/></clipPath>
</defs>

<rect x="0" y="0" width="1280" height="380" rx="16" fill="#1b1b1f"/>
<rect x="0" y="0" width="1280" height="380" rx="16" fill="url(#pdots)" opacity="0.55"/>

<text x="72" y="94" fill="#5e9bff" font-size="16" font-weight="500" letter-spacing="1.2">New in v0.1</text>
<text x="70" y="156" fill="#e6e6ea" font-size="44" font-weight="600">Export PNG sequence</text>
<text x="72" y="204" fill="#9a9aa6" font-size="20">Turn any clip into lossless PNG frames</text>
<text x="72" y="232" fill="#9a9aa6" font-size="20">with alpha preserved — no audio.</text>

<g clip-path="url(#pB)">
<rect x="688" y="142" width="170" height="118" fill="#26262c"/>
<rect x="688" y="142" width="170" height="30" fill="#2f2f37"/>
<rect x="688" y="142" width="170" height="4" fill="#6bd968"/>
</g>
<rect x="688" y="142" width="170" height="118" rx="10" fill="none" stroke="#3a3a44" stroke-width="1"/>
<circle cx="704" cy="158" r="4" fill="#6bd968"/>
<text x="716" y="162" fill="#e6e6ea" font-size="13" font-weight="600">Output</text>
<rect x="704" y="182" width="138" height="24" rx="4" fill="#1b1b1f" stroke="#ffb020" stroke-width="1"/>
<text x="773" y="198" fill="#ffb020" font-size="13" font-weight="600" text-anchor="middle">PNG sequence</text>
<text x="704" y="228" fill="#9a9aa6" font-size="12">lossless · keeps alpha</text>
<text x="704" y="246" fill="#9a9aa6" font-size="12">frames/frames_00001.png</text>
<circle cx="858" cy="201" r="6" fill="#6bd968" stroke="#1b1b1f" stroke-width="2"/>

<line x1="870" y1="201" x2="946" y2="201" stroke="#6bd968" stroke-width="2.5" marker-end="url(#parr)"/>

<rect x="960" y="124" width="66" height="26" rx="13" fill="#2f2f37" stroke="#3a3a44" stroke-width="1"/>
<rect x="972" y="133" width="11" height="8" rx="1.5" fill="#ff9845"/>
<rect x="972" y="131" width="5" height="3" rx="1" fill="#ff9845"/>
<text x="990" y="141" fill="#e6e6ea" font-size="12">frames</text>

<rect x="1004" y="118" width="126" height="90" rx="6" fill="#181820" stroke="#3a3a44" stroke-width="1"/>
<rect x="986" y="139" width="126" height="90" rx="6" fill="#14141a" stroke="#3a3a44" stroke-width="1"/>
<g clip-path="url(#pF)">
<rect x="968" y="160" width="126" height="90" fill="url(#ck)"/>
<circle cx="1018" cy="200" r="22" fill="#4f8cff"/>
<rect x="1040" y="212" width="60" height="40" fill="#6bd968" opacity="0.9"/>
</g>
<rect x="968" y="160" width="126" height="90" rx="6" fill="none" stroke="#4f8cff" stroke-width="1.5"/>
<text x="968" y="270" fill="#9a9aa6" font-size="12">frame_00001.png</text>
</svg>
