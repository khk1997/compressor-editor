<svg width="100%" viewBox="0 0 1280 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Compress videos feature banner</title>
<desc>A dark node-editor scene: an Input video of 240 MB compresses through an Output node with a quality slider down to 18 MB.</desc>
<defs>
<pattern id="cdots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" fill="#26262c"/></pattern>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}</style>
<clipPath id="cA"><rect x="700" y="110" width="168" height="120" rx="10"/></clipPath>
<clipPath id="cB"><rect x="1014" y="110" width="168" height="120" rx="10"/></clipPath>
</defs>

<rect x="0" y="0" width="1280" height="380" rx="16" fill="#1b1b1f"/>
<rect x="0" y="0" width="1280" height="380" rx="16" fill="url(#cdots)" opacity="0.55"/>

<text x="72" y="94" fill="#5e9bff" font-size="16" font-weight="500" letter-spacing="1.2">MP4 · MOV · WebM · WebP</text>
<text x="70" y="158" fill="#e6e6ea" font-size="48" font-weight="600">Compress videos</text>
<text x="72" y="206" fill="#9a9aa6" font-size="20">Shrink file size with a quality slider</text>
<text x="72" y="234" fill="#9a9aa6" font-size="20">or an exact target size (2-pass).</text>

<rect x="872" y="66" width="162" height="34" rx="17" fill="#2f2f37" stroke="#3a3a44" stroke-width="1"/>
<text x="886" y="88" fill="#9a9aa6" font-size="14" text-decoration="line-through">240 MB</text>
<text x="940" y="88" fill="#9a9aa6" font-size="14">→</text>
<text x="960" y="88" fill="#6bd968" font-size="14" font-weight="600">18 MB</text>

<g clip-path="url(#cA)">
<rect x="700" y="110" width="168" height="120" fill="#26262c"/>
<rect x="700" y="110" width="168" height="30" fill="#2f2f37"/>
<rect x="700" y="110" width="168" height="4" fill="#4f8cff"/>
</g>
<rect x="700" y="110" width="168" height="120" rx="10" fill="none" stroke="#3a3a44" stroke-width="1"/>
<circle cx="716" cy="126" r="4" fill="#4f8cff"/>
<text x="728" y="130" fill="#e6e6ea" font-size="13" font-weight="600">Input</text>
<rect x="716" y="150" width="136" height="48" rx="4" fill="#101014" stroke="#3a3a44" stroke-width="1"/>
<polygon points="777,165 777,183 792,174" fill="#6f9bff"/>
<text x="716" y="219" fill="#9a9aa6" font-size="13">240 MB · MP4</text>
<circle cx="868" cy="170" r="6" fill="#4f8cff" stroke="#1b1b1f" stroke-width="2"/>

<g clip-path="url(#cB)">
<rect x="1014" y="110" width="168" height="120" fill="#26262c"/>
<rect x="1014" y="110" width="168" height="30" fill="#2f2f37"/>
<rect x="1014" y="110" width="168" height="4" fill="#6bd968"/>
</g>
<rect x="1014" y="110" width="168" height="120" rx="10" fill="none" stroke="#3a3a44" stroke-width="1"/>
<circle cx="1030" cy="126" r="4" fill="#6bd968"/>
<text x="1042" y="130" fill="#e6e6ea" font-size="13" font-weight="600">Output</text>
<text x="1030" y="162" fill="#9a9aa6" font-size="12">Quality 80</text>
<rect x="1030" y="172" width="120" height="4" rx="2" fill="#3a3a44"/>
<rect x="1030" y="172" width="84" height="4" rx="2" fill="#4f8cff"/>
<circle cx="1114" cy="174" r="6" fill="#4f8cff" stroke="#1b1b1f" stroke-width="2"/>
<text x="1030" y="204" fill="#9a9aa6" font-size="12">WebM · WebP · MOV</text>
<text x="1030" y="222" fill="#6bd968" font-size="14" font-weight="600">18 MB</text>
<circle cx="1014" cy="170" r="6" fill="#6bd968" stroke="#1b1b1f" stroke-width="2"/>

<path d="M868,170 C930,170 952,170 1014,170" fill="none" stroke="#6f9bff" stroke-width="2.5"/>
</svg>
