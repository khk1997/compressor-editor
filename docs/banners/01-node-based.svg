<svg width="100%" viewBox="0 0 1280 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Node-based editor feature banner</title>
<desc>A dark scene showing a linear node graph: Input connects to Retime, then Crop, then Output.</desc>
<defs>
<pattern id="ndots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.3" fill="#26262c"/></pattern>
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}</style>
<clipPath id="nI"><rect x="636" y="160" width="112" height="96" rx="10"/></clipPath>
<clipPath id="nR"><rect x="788" y="160" width="112" height="96" rx="10"/></clipPath>
<clipPath id="nC"><rect x="940" y="160" width="112" height="96" rx="10"/></clipPath>
<clipPath id="nO"><rect x="1092" y="160" width="112" height="96" rx="10"/></clipPath>
</defs>

<rect x="0" y="0" width="1280" height="380" rx="16" fill="#1b1b1f"/>
<rect x="0" y="0" width="1280" height="380" rx="16" fill="url(#ndots)" opacity="0.55"/>

<text x="72" y="94" fill="#5e9bff" font-size="16" font-weight="500" letter-spacing="1.2">Blender-style graph</text>
<text x="70" y="158" fill="#e6e6ea" font-size="46" font-weight="600">Node-based editor</text>
<text x="72" y="204" fill="#9a9aa6" font-size="20">Wire inputs, effects and outputs into</text>
<text x="72" y="232" fill="#9a9aa6" font-size="20">a visual pipeline — just drag to connect.</text>

