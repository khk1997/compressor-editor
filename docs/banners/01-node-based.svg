<svg width="100%" viewBox="0 0 1280 380" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Node-based editor feature banner</title>
<desc>A dark scene showing a small node graph: an Input node fans into Crop and Retime nodes that merge into an Output node.</desc>
<defs>
